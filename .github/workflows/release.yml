name: Release WordPress plugin
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Eq "^ \* Version: ${version}$" equiviq-wordpress/equiviq-wordpress.php
          grep -Fq "define('EQW_VERSION', '${version}')" equiviq-wordpress/equiviq-wordpress.php
          find equiviq-wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/updater.php
          php tests/lead-theme.php
          php tests/lead-route.php
          zip -qr "equiviq-wordpress-${version}.zip" equiviq-wordpress
      - name: Publish installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "equiviq-wordpress-${version}.zip" --verify-tag --generate-notes --latest
